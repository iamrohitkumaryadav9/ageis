[alembic]
script_location = aegis/storage/migrations
prepend_sys_path = .
path_separator = os
# The URL is taken from AEGIS_DATABASE_URL (see aegis/storage/migrations/env.py).

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
