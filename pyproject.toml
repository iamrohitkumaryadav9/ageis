[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS - Autonomous ML Incident Commander: detection, investigation, diagnosis and controlled remediation of ML incidents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn==1.9.1",
    "river==0.22.0",
    "evidently==0.7.23",
    "shap",
    "pydantic>=2",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "httpx",
    "langgraph==1.2.20",
    "langchain-core",
    "mlflow==3.16.1",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "prometheus-client",
    "structlog",
    "psutil",
    "matplotlib",
    "pyarrow>=25.0.1",
    "joblib>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/dashboard", "data", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a reachable PostgreSQL instance",
    "ollama: requires a reachable Ollama instance with the configured model",
]

[tool.coverage.run]
source = ["aegis"]
